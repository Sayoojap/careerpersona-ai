<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — CareerPersona AI</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="auth-wrap">
  <div style="width:100%; max-width:420px;">
    <div class="top-logo"><a href="index.html" class="logo">CareerPersona <span class="badge">AI</span></a></div>
    <div class="card auth-card" style="max-width:420px;">
      <h2 style="text-align:center;">Create your account</h2>
      <p style="text-align:center; margin-bottom:26px;">Start practicing interviews in under a minute.</p>

      <form onsubmit="return false;">
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" placeholder="Your name" required>
        </div>
        <div class="field">
          <label for="remail">Email</label>
          <input type="email" id="remail" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="rpassword">Password</label>
          <input type="password" id="rpassword" placeholder="At least 8 characters" required>
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Create account</button>
      </form>

      <p style="text-align:center; margin-top:18px; font-size:.88rem;">
        Already registered? <a href="login.html">Log in</a>
      </p>
    </div>
  </div>
</div>

</body>
</html>
